# Workflow: refactor（代码重构）
# 执行顺序：architect → backend_service / frontend_engineer → test_agent → security_agent → reviewer

# 规范来源：所有 stage 的 agent 必须遵守各 .claude/skills/rule-* 的「硬性禁令」小节（主题查表见 .claude/project-meta/skills-index.md，页面层禁止清单在 rule-project-structure），
#           写法与清单按需读 .claude/skills/rule-*，架构原理读 docs/ARCHITECTURE.md（冲突时以后者+代码为准）
name: refactor
description: 代码重构工作流，从架构评估到审查验收

trigger:
  keywords: ["重构", "refactor", "优化结构", "提取", "拆分"]
  manual: "@refactor"

stages:
  - id: refactor_plan
    agent: architect
    description: 重构方案设计
    input_from: user
    output_to: [backend_service, frontend_engineer]
    timeout: 30m
    quality_gate:
      - 重构边界明确
      - 不影响现有功能
      - 向后兼容

  - id: refactor_backend
    agent: backend_service
    description: 后端重构执行
    input_from: refactor_plan
    output_to: test_agent
    timeout: 120m
    quality_gate:
      - 重构后功能不变
      - 代码更简洁
      - 无新增依赖

  - id: refactor_frontend
    agent: frontend_engineer
    description: 前端重构执行
    input_from: refactor_plan
    output_to: test_agent
    timeout: 120m
    quality_gate:
      - 重构后功能不变
      - 代码更简洁
      - 多端表现一致

  - id: refactor_test
    agent: test_agent
    description: 回归测试验证
    input_from: [refactor_backend, refactor_frontend]
    output_to: security_agent
    timeout: 40m
    quality_gate:
      - 原功能测试全通过
      - 新增测试覆盖重构部分
      - 覆盖率不降低

  - id: refactor_security
    agent: security_agent
    description: 安全再审查
    input_from: refactor_test
    output_to: reviewer
    timeout: 20m
    quality_gate:
      - 重构未引入安全风险
      - 原有安全措施未退化

  - id: refactor_review
    agent: reviewer
    description: 重构审查（评审若执行必须最后一步；是否评审由用户决定）
    review_confirmation:
      ask: "收尾时问用户一次：是否评审？要做请在本仓新开窗口（评审必须新开窗口；代码窗口不自评）"
      on_decline: "跳过本阶段，记录「评审：跳过（用户确认）」"
      rules: "project-dev 步骤 12.5；报告写 versions/vN/review*.md，结论回 versions/vN/CHANGELOG.md「评审」小节"
    input_from: refactor_security
    output_to: user
    timeout: 30m
    quality_gate:
      - 重构目标达成
      - 代码质量提升
      - 无功能退化
    final: true

post_workflow:
  # update_changelog 已于 2026-11-02 停用：变更记录由 git commit message 承担
